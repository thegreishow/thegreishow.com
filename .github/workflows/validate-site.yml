name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository
        id: validation
        continue-on-error: true
        run: |
          node scripts/validate-site.mjs > site-validation.txt 2>&1
          result=$?
          cat site-validation.txt
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Publish validation failure
        if: steps.validation.outputs.result != '0' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Site validation failure"
            echo
            echo '```text'
            cat site-validation.txt
            echo '```'
          } > site-validation-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file site-validation-comment.md
      - name: Enforce validation
        if: steps.validation.outputs.result != '0'
        run: exit 1
