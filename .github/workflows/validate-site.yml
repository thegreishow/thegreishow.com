name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate structure and references
        run: node scripts/validate-site.mjs
      - name: Run critical smoke checks
        run: node scripts/smoke-test.mjs
