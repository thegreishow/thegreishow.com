<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1a0b12">
  <meta name="description" content="Ride the Riddim, Raging Bull, Rolling Calf, or Run the Track in Rodeo: Are You Ready, a music game by The Grei Show.">
  <title>Rodeo: Are You Ready | The Grei Show Arcade</title>
  <link rel="preload" href="assets/rodeo-arena.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/ride-animation-v3.png" as="image" type="image/png">
  <link rel="preload" href="assets/matador-sprites.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/matadora-animation-v4.png" as="image" type="image/png">
  <link rel="preload" href="assets/raging-bull-hit-v1.png" as="image" type="image/png">
  <link rel="preload" href="assets/charging-bull-animation-v3.png" as="image" type="image/png">
  <link rel="preload" href="assets/catch-cow-sprites.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/horseback-rider-animation-v3.png" as="image" type="image/png">
  <link rel="preload" href="assets/runaway-cow-animation-v2.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/ride-fall-animation-v2.png" as="image" type="image/png">
  <link rel="preload" href="assets/rolling-calf-events-v1.png" as="image" type="image/png">
  <link rel="preload" href="assets/voice/three-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/two-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/one-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/start-ride-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/start-raging-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/start-calf-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/start-race-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/yeehaw-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/ole-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="assets/voice/legendary-v2.mp3" as="audio" type="audio/mpeg">
  <link rel="stylesheet" href="assets/game.css?v=20260813f">
</head>
<body>
<script src="../../engine/game-shell.js?v=20260811f"></script>
<main class="wrap">
  <header class="hud">
    <div class="brand">
      <p class="eyebrow">The Grei Show presents</p>
      <h1 aria-label="Rodeo: Are You Ready"><span class="full-title" aria-hidden="true">Rodeo: Are You Ready</span><span class="mobile-title" aria-hidden="true">Rodeo</span></h1>
    </div>
    <nav class="run-nav" aria-label="In-game navigation">
      <button type="button" id="gameMenuButton" aria-label="Open game menu"><span aria-hidden="true">☰</span><small>Menu</small></button>
    </nav>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="score">0</b><span>Score</span></div>
      <div class="stat"><b id="combo">0</b><span>Streak</span></div>
      <div class="stat"><b id="time">0</b><span>Time</span></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Rodeo game playfield">
    <video class="arena-video" id="arenaVideo" muted loop autoplay playsinline preload="auto" poster="assets/rodeo-arena.webp" aria-hidden="true">
      <source src="assets/exec-cb0ec69b-a278-437a-977e-973194b4cf70.mp4" type="video/mp4">
    </video>
    <canvas id="game" width="960" height="540"></canvas>
    <p class="sr-only" id="directionAnnounce" aria-live="assertive"></p>
    <div class="meter" id="heatMeter" aria-label="Heat: fill each bar to raise the score multiplier">
      <span class="meter-copy">
        <strong id="heatLabel">Heat</strong>
        <small id="heatPurpose">Next: ×2</small>
        <span class="heat-tiers" id="heatTiers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </span>
      <div class="track"><div class="fill" id="heat"></div></div>
      <output id="heatValue" aria-live="off">0%</output>
    </div>
    <div class="overlay" id="overlay">
      <div class="panel" id="panel">
        <p class="mini" id="kicker">Choose your event</p>
        <h2 id="overlayTitle">Are You<br>Ready?</h2>
        <p id="overlayCopy" hidden></p>
        <div class="mode-picker" id="modePicker" aria-label="Choose a rodeo event">
          <button type="button" class="mode-card selected" data-mode="ride" aria-pressed="true">
            <img class="mode-cover" src="assets/rodeo-cover.webp" alt="" width="58" height="58">
            <strong>Ride the Riddim</strong>
          </button>
          <button type="button" class="mode-card" data-mode="matador" aria-pressed="false">
            <span class="mode-cover matador-cover" aria-hidden="true"></span>
            <strong>Raging Bull</strong>
          </button>
          <button type="button" class="mode-card" data-mode="catch" aria-pressed="false">
            <span class="mode-cover catch-cover" aria-hidden="true"></span>
            <strong>Rolling Calf</strong>
          </button>
          <button type="button" class="mode-card" data-mode="race" aria-pressed="false">
            <span class="mode-cover race-cover" aria-hidden="true"></span>
            <strong>Run the Track</strong>
          </button>
        </div>
        <fieldset class="difficulty-picker" id="difficultyPicker">
          <legend>Difficulty</legend>
          <div class="difficulty-options">
            <button type="button" class="difficulty" data-difficulty="easy" aria-pressed="false">
              <strong>Easy</strong>
            </button>
            <button type="button" class="difficulty selected" data-difficulty="standard" aria-pressed="true">
              <strong>Standard</strong>
            </button>
          </div>
        </fieldset>
        <span class="sr-only" id="audioStatus" aria-live="polite">Music on</span>
        <div id="results" hidden></div>
        <button class="btn" id="start">Enter the Rodeo</button>
      </div>
    </div>
  </section>

  <section class="controls" id="controls" aria-label="Game controls">
    <div class="joystick-wrap" id="joystickWrap" hidden>
      <div class="joystick-pad" id="joystickPad" role="group" aria-label="Movement joystick" tabindex="0">
        <span class="joystick-ring"></span>
        <span class="joystick-thumb" id="joystickThumb"></span>
      </div>
      <small id="joystickLabel">Move</small>
    </div>
    <button class="control" data-action="left" aria-label="Lean left"><span>←</span><small>Left</small></button>
    <button class="control" data-action="up" aria-label="Lean forward"><span>↑</span><small>Forward</small></button>
    <button class="control" data-action="down" aria-label="Lean back"><span>↓</span><small>Back</small></button>
    <button class="control" data-action="right" aria-label="Lean right"><span>→</span><small>Right</small></button>
    <button class="control lasso-control" id="lassoButton" aria-label="Throw lasso" hidden><span>◎</span><small>Lasso</small></button>
    <button class="control jump-control" id="jumpButton" aria-label="Vault over the bull" hidden><span>↥</span><small>Vault</small></button>
  </section>
  <div class="hint" id="controlHint">Arrow keys or W A S D · Match the glowing direction · Space pauses</div>
</main>
<audio id="music" preload="auto" loop src="/api/media?id=15w7z7plnNa-vw30QyH-O_2wp8kgGfKqV&amp;filename=The-Grei-Show-Rodeo-Demo&amp;type=audio"></audio>
<script src="assets/game.js?v=20260813h"></script>
</body>
</html>
