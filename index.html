<body class="home-page">
  <div id="site-header"></div>

  <main class="home">
    <section class="hero" aria-labelledby="home-title">
      <div class="hero-copy">
        <p class="hero-kicker">Independent artist &middot; Kingston, Jamaica</p>
        <h1 id="home-title" class="hero-title">The Grei Show</h1>
        <p class="hero-lead">Music, stories, and worlds without limits.</p>

        <div class="hero-actions">
          <button class="home-button primary open-platforms-trigger" type="button" aria-label="Choose your platform"><span class="cta-full">Choose your platform</span><span class="cta-short" aria-hidden="true">Listen</span></button>
          <a class="home-button internal" href="#explore" aria-label="Explore the work"><span class="cta-full">Explore the work</span><span class="cta-short" aria-hidden="true">Explore</span></a>
          <a class="home-button primary visuals-cta" href="visuals.html" aria-label="View visuals"><span class="cta-full">View visuals</span><span class="cta-short" aria-hidden="true">Visuals</span></a>
        </div>
      </div>

      <div class="hero-visual">
        <div class="hero-visual-frame">
          <video class="home-hero-video" id="home-hero-video" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture poster="https://drive.google.com/thumbnail?id=1R6HGjhGqyeTGkaU_GEAxLlT8aRAf5x3F&amp;sz=w1600" aria-label="Rodeo promotional visual">
            <source src="/api/media?id=1GtHsgqPKi99uUC-bohE7clyxporo4YMN&amp;filename=Rodeo-Promo&amp;type=video" type="video/mp4">
          </video>
        </div>
      </div>
    </section>

    <section id="explore" class="home-section home-section--portals" aria-label="Choose your portal">
      <div class="portal-grid">
        <a class="portal-card" href="music.html" data-track="explore_music" data-track-label="Portal - Music">
          <img src="assets/img/no-drama.webp" alt="Audio Universe entry" width="1200" height="1200" loading="lazy" decoding="async">
          <span class="portal-card__body">
            <span class="card-kicker">Listen</span>
            <h3>Audio Universe</h3>
            <span class="portal-link">Enter the music</span>
          </span>
        </a>

        <a class="portal-card" href="books.html" data-track="explore_books" data-track-label="Portal - Books">
          <img src="assets/images/books/astral-thread-cover.jpg" alt="The Astral Thread book" width="960" height="1200" loading="lazy" decoding="async">
          <span class="portal-card__body">
            <span class="card-kicker">Read</span>
            <h3>The Astral Thread</h3>
            <span class="portal-link">Open the book</span>
          </span>
        </a>

        <a class="portal-card portal-card--rodeo" href="arcade.html" data-track="explore_arcade" data-track-label="Portal - Arcade">
          <img src="arcade/assets/thumbnails/rodeo-are-you-ready.webp?v=20260811" alt="Rodeo: Are You Ready in Grei Arcade" width="1280" height="720" loading="lazy" decoding="async">
          <span class="portal-card__body">
            <span class="card-kicker">Play</span>
            <h3>Grei Arcade</h3>
            <span class="portal-link">Are you ready for the Rodeo?</span>
          </span>
