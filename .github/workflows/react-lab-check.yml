name: React Lab Check

on:
  push:
    branches:
      - react-bits-lab
    paths:
      - 'react-lab/**'
      - 'react-preview.html'
      - 'assets/css/react-preview.css'
      - 'assets/js/react-preview.js'
      - '.github/workflows/react-lab-check.yml'
  pull_request:
    paths:
      - 'react-lab/**'
      - 'react-preview.html'
      - 'assets/css/react-preview.css'
      - 'assets/js/react-preview.js'
      - '.github/workflows/react-lab-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund

      - name: Build Vite prototype
        run: |
          set +e
          npm run build --silent > build.log 2>&1
          result=$?
          if [ $result -ne 0 ]; then
            echo "===== REACT LAB BUILD FAILURE ====="
            tail -n 80 build.log
            exit $result
          fi
          cat build.log

      - name: Check zero-build preview syntax
        working-directory: .
        run: node --check assets/js/react-preview.js
