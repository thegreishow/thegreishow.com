name: React Lab Check

on:
  push:
    branches:
      - react-bits-lab
    paths:
      - 'react-lab/**'
      - 'react-preview.html'
      - 'assets/css/react-preview.css'
      - 'assets/js/react-preview.js'
      - '.github/workflows/react-lab-check.yml'
  pull_request:
    paths:
      - 'react-lab/**'
      - 'react-preview.html'
      - 'assets/css/react-preview.css'
      - 'assets/js/react-preview.js'
      - '.github/workflows/react-lab-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund

      - name: Validate architecture contract
        run: npm run check:architecture --silent

      - name: Build Vite prototype
        id: build
        run: |
          set +e
          npm run build --silent > build.log 2>&1
          result=$?
          if [ $result -ne 0 ]; then
            echo "===== REACT LAB BUILD FAILURE ====="
            tail -n 100 build.log
            exit $result
          fi
          cat build.log

      - name: Post compiler failure to draft PR
        if: failure() && github.event_name == 'pull_request'
        working-directory: react-lab
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### React Lab build diagnostic"
            echo
            echo '```text'
            if [ -f build.log ]; then tail -n 100 build.log; else echo 'Architecture or dependency validation failed before build.log was created.'; fi
            echo '```'
          } > build-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file build-comment.md

      - name: Check zero-build preview syntax
        if: success()
        working-directory: .
        run: node --check assets/js/react-preview.js

  site-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository site validator
        run: |
          set +e
          node scripts/validate-site.mjs > site-validation.log 2>&1
          result=$?
          if [ $result -ne 0 ]; then
            echo "===== SITE VALIDATION FAILURE ====="
            tail -n 100 site-validation.log
            exit $result
          fi
          cat site-validation.log

      - name: Post site validation failure to draft PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Site validation diagnostic"
            echo
            echo '```text'
            tail -n 100 site-validation.log
            echo '```'
          } > site-validation-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file site-validation-comment.md
