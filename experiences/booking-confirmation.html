<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmation | iLoveKingston</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/experience-detail.css">
  <style>
    .confirmation-shell{min-height:82vh;display:grid;place-items:center;padding:120px 20px 80px;background:#f5f5f7}.confirmation-card{width:min(760px,100%);padding:clamp(32px,7vw,70px);border-radius:36px;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.07)}.confirmation-card h2{margin:0;font-size:clamp(3rem,8vw,6rem);line-height:.92;letter-spacing:-.06em}.confirmation-card>p:not(.experience-kicker){color:#6e6e73;font-size:1.08rem;line-height:1.7}.confirmation-details{display:grid;gap:8px;margin:28px 0;padding:24px 0;border-top:1px solid #d2d2d7;border-bottom:1px solid #d2d2d7}.confirmation-details strong{font-size:1.35rem}.confirmation-details span{color:#6e6e73}.confirmation-spinner{width:28px;height:28px;margin-bottom:26px;border:3px solid #d2d2d7;border-top-color:#0071e3;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body class="experience-page">
  <div id="site-header"></div>
  <main class="confirmation-shell">
    <section id="tour-confirmation-status" class="confirmation-card" aria-live="polite">
      <div class="confirmation-spinner" aria-hidden="true"></div>
      <h2>Confirming your booking…</h2>
      <p>We’re verifying your PayPal payment and locking your place.</p>
    </section>
  </main>
  <script src="../shared/nav.js"></script>
</body>
</html>
